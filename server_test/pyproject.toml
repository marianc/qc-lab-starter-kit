[project]
name = "test-servers"
version = "0.1.0"
description = "A project to test Quality Control servers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.128.0",
    "psycopg2-binary>=2.9.11",
    "pyodbc>=5.3.0",
    "pytest>=9.0.2",
    "pytest-base-url>=2.1.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "sqlacodegen>=3.2.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::pytest.PytestCollectionWarning",
]
